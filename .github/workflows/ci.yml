name: OPIP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: opip-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/population-api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/population-api/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/services/population-api
        run: python -m pytest -q

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan source code
        run: semgrep scan --config auto --error .

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Audit Python dependencies
        working-directory: services/population-api
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high

  filesystem-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  sonarqube:
    name: SonarQube SAST and Quality Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, opip]
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate SonarQube connectivity
        shell: bash
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          test -n "$SONAR_HOST_URL"
          getent hosts sonarqube.cloudgenius.ca
          curl --fail --silent --show-error "$SONAR_HOST_URL/api/system/status"

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  container-build:
    name: Container build validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        run: docker build -t opip-api:ci services/population-api
      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 -t opip-frontend:ci frontend
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opip-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opip-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  security-gate:
    name: DevSecOps security gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-tests
      - frontend-build
      - sast
      - secret-scan
      - dependency-scan
      - filesystem-scan
      - sonarqube
      - container-build
    steps:
      - name: Enforce required results
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND: ${{ needs.backend-tests.result }}
          FRONTEND: ${{ needs.frontend-build.result }}
          SAST: ${{ needs.sast.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          DEPENDENCIES: ${{ needs.dependency-scan.result }}
          FILESYSTEM: ${{ needs.filesystem-scan.result }}
          SONARQUBE: ${{ needs.sonarqube.result }}
          CONTAINERS: ${{ needs.container-build.result }}
        run: |
          set -euo pipefail

          for result in "$BACKEND" "$FRONTEND" "$SAST" "$SECRETS" "$DEPENDENCIES" "$FILESYSTEM" "$CONTAINERS"; do
            if [ "$result" != "success" ]; then
              echo "One or more OPIP quality/security gates failed."
              exit 1
            fi
          done

          if [ "$EVENT_NAME" = "push" ] && [ "$SONARQUBE" != "success" ]; then
            echo "SonarQube analysis or Quality Gate failed."
            exit 1
          fi

          echo "All OPIP quality and security gates passed."

  publish-harbor:
    name: Build, attest and publish images to Harbor
    needs: [security-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, opip]
    permissions:
      contents: read
      id-token: write
    env:
      HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      HARBOR_PROJECT: opip
      API_IMAGE_NAME: opip-api
      FRONTEND_IMAGE_NAME: opip-frontend
      COSIGN_YES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate runner and Harbor
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HARBOR_REGISTRY"
          test -n "$HARBOR_USERNAME"
          test -n "$HARBOR_PASSWORD"
          command -v docker
          command -v trivy
          command -v syft
          command -v grype
          command -v cosign
          getent hosts "$HARBOR_REGISTRY"
          curl --fail --silent --show-error "https://$HARBOR_REGISTRY/api/v2.0/ping"
          docker info >/dev/null

      - name: Build Harbor-tagged images
        shell: bash
        run: |
          set -euo pipefail
          API_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:${GITHUB_SHA}"
          FRONTEND_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:${GITHUB_SHA}"

          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$API_IMAGE" \
            services/population-api

          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$FRONTEND_IMAGE" \
            frontend

      - name: Trivy image security gate
        shell: bash
        run: |
          set -euo pipefail
          API_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:${GITHUB_SHA}"
          FRONTEND_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:${GITHUB_SHA}"

          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            "$API_IMAGE"

          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            "$FRONTEND_IMAGE"

      - name: Generate SPDX SBOMs with Syft
        shell: bash
        run: |
          set -euo pipefail
          API_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:${GITHUB_SHA}"
          FRONTEND_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:${GITHUB_SHA}"

          syft "$API_IMAGE" -o spdx-json=sbom-api.spdx.json
          syft "$FRONTEND_IMAGE" -o spdx-json=sbom-frontend.spdx.json

          test -s sbom-api.spdx.json
          test -s sbom-frontend.spdx.json

      - name: Grype vulnerability gate
        shell: bash
        run: |
          set -euo pipefail
          API_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:${GITHUB_SHA}"
          FRONTEND_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:${GITHUB_SHA}"

          grype "$API_IMAGE" --fail-on high --only-fixed
          grype "$FRONTEND_IMAGE" --fail-on high --only-fixed

      - name: Log in to Harbor
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" \
            --username "$HARBOR_USERNAME" \
            --password-stdin

      - name: Tag main aliases
        shell: bash
        run: |
          set -euo pipefail
          API_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:${GITHUB_SHA}"
          FRONTEND_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:${GITHUB_SHA}"

          docker tag "$API_IMAGE" "$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:main"
          docker tag "$FRONTEND_IMAGE" "$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:main"

      - name: Push images and capture immutable digests
        id: push
        shell: bash
        run: |
          set -euo pipefail
          API_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:${GITHUB_SHA}"
          FRONTEND_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:${GITHUB_SHA}"

          API_PUSH_OUTPUT="$(docker push "$API_IMAGE")"
          printf '%s\n' "$API_PUSH_OUTPUT"
          API_DIGEST="$(printf '%s\n' "$API_PUSH_OUTPUT" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -1)"
          [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:main"

          FRONTEND_PUSH_OUTPUT="$(docker push "$FRONTEND_IMAGE")"
          printf '%s\n' "$FRONTEND_PUSH_OUTPUT"
          FRONTEND_DIGEST="$(printf '%s\n' "$FRONTEND_PUSH_OUTPUT" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -1)"
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:main"

          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$FRONTEND_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign immutable image digests with Cosign keyless signing
        shell: bash
        env:
          API_DIGEST: ${{ steps.push.outputs.api_digest }}
          FRONTEND_DIGEST: ${{ steps.push.outputs.frontend_digest }}
        run: |
          set -euo pipefail

          API_REF="$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME@$API_DIGEST"
          FRONTEND_REF="$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME@$FRONTEND_DIGEST"

          cosign sign --yes "$API_REF"
          cosign sign --yes "$FRONTEND_REF"

      - name: Attest SPDX SBOMs to Harbor
        shell: bash
        env:
          API_DIGEST: ${{ steps.push.outputs.api_digest }}
          FRONTEND_DIGEST: ${{ steps.push.outputs.frontend_digest }}
        run: |
          set -euo pipefail

          API_REF="$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME@$API_DIGEST"
          FRONTEND_REF="$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME@$FRONTEND_DIGEST"

          cosign attest --yes --type spdxjson --predicate sbom-api.spdx.json "$API_REF"
          cosign attest --yes --type spdxjson --predicate sbom-frontend.spdx.json "$FRONTEND_REF"

      - name: Verify Cosign signatures
        shell: bash
        env:
          API_DIGEST: ${{ steps.push.outputs.api_digest }}
          FRONTEND_DIGEST: ${{ steps.push.outputs.frontend_digest }}
        run: |
          set -euo pipefail

          IDENTITY='^https://github.com/globalcloudgenius/cloudgenius-opip-app/.github/workflows/ci.yml@refs/heads/main$'
          ISSUER='https://token.actions.githubusercontent.com'

          API_REF="$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME@$API_DIGEST"
          FRONTEND_REF="$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME@$FRONTEND_DIGEST"

          cosign verify \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$API_REF"

          cosign verify \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" \
            "$FRONTEND_REF"

      - name: Publish supply-chain summary
        shell: bash
        env:
          API_DIGEST: ${{ steps.push.outputs.api_digest }}
          FRONTEND_DIGEST: ${{ steps.push.outputs.frontend_digest }}
        run: |
          {
            echo '### Harbor supply-chain publication'
            echo
            echo '- Runner: `CG-GHA-RUNNER-01`'
            echo '- Security gates: Trivy + Grype'
            echo '- SBOM: Syft SPDX JSON + Cosign attestation'
            echo '- Signing: Cosign keyless OIDC'
            echo "- API digest: \`$API_DIGEST\`"
            echo "- Frontend digest: \`$FRONTEND_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of Harbor
        if: always()
        shell: bash
        run: docker logout "$HARBOR_REGISTRY" || true
