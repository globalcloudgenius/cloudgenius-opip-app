name: OPIP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: opip-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/population-api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/population-api/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/services/population-api
        run: python -m pytest -q

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan source code
        run: semgrep scan --config auto --error .

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Audit Python dependencies
        working-directory: services/population-api
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high

  filesystem-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  container-build:
    name: Container build validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        run: docker build -t opip-api:ci services/population-api
      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 -t opip-frontend:ci frontend
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opip-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
      - name: Scan frontend image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opip-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  security-gate:
    name: DevSecOps security gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-tests
      - frontend-build
      - sast
      - secret-scan
      - dependency-scan
      - filesystem-scan
      - container-build
    steps:
      - name: Enforce required results
        env:
          BACKEND: ${{ needs.backend-tests.result }}
          FRONTEND: ${{ needs.frontend-build.result }}
          SAST: ${{ needs.sast.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          DEPENDENCIES: ${{ needs.dependency-scan.result }}
          FILESYSTEM: ${{ needs.filesystem-scan.result }}
          CONTAINERS: ${{ needs.container-build.result }}
        run: |
          for result in "$BACKEND" "$FRONTEND" "$SAST" "$SECRETS" "$DEPENDENCIES" "$FILESYSTEM" "$CONTAINERS"; do
            if [ "$result" != "success" ]; then
              echo "One or more OPIP quality/security gates failed."
              exit 1
            fi
          done
          echo "All OPIP quality and security gates passed."

  publish-harbor:
    name: Publish images to Harbor
    needs: [security-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    env:
      HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      HARBOR_PROJECT: opip
      API_IMAGE_NAME: opip-api
      FRONTEND_IMAGE_NAME: opip-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Harbor configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HARBOR_REGISTRY"
          test -n "$HARBOR_USERNAME"
          test -n "$HARBOR_PASSWORD"
          getent hosts "$HARBOR_REGISTRY"
          curl --fail --silent --show-error --head "https://$HARBOR_REGISTRY/api/v2.0/ping"

      - name: Build Harbor-tagged API image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --tag "$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:${GITHUB_SHA}" \
            services/population-api

      - name: Build Harbor-tagged frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            --tag "$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:${GITHUB_SHA}" \
            frontend

      - name: Scan API image before publish
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.HARBOR_REGISTRY }}/opip/opip-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Scan frontend image before publish
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.HARBOR_REGISTRY }}/opip/opip-frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to Harbor
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" \
            --username "$HARBOR_USERNAME" \
            --password-stdin

      - name: Tag main aliases
        shell: bash
        run: |
          set -euo pipefail
          docker tag \
            "$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:${GITHUB_SHA}" \
            "$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:main"
          docker tag \
            "$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:${GITHUB_SHA}" \
            "$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:main"

      - name: Push API image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:${GITHUB_SHA}"
          docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/$API_IMAGE_NAME:main"

      - name: Push frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:${GITHUB_SHA}"
          docker push "$HARBOR_REGISTRY/$HARBOR_PROJECT/$FRONTEND_IMAGE_NAME:main"

      - name: Log out of Harbor
        if: always()
        shell: bash
        run: docker logout "$HARBOR_REGISTRY" || true
